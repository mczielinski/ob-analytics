[project]
name = "ob-analytics"
version = "0.1.0"
description = "Limit order book analytics and visualization — reconstruct trades, classify orders, and visualize market microstructure from raw exchange events."
authors = [{ name = "Mark Zielinski", email = "mczielinski@gmail.com" }]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3,<4",
    "matplotlib>=3.11.0,<4",
    "seaborn>=0.13.2,<1",
    "pydantic>=2.13.4,<3",
    "pyarrow>=24.0.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
interactive = ["plotly>=6.8.0"]
bokeh = ["bokeh>=3.1"]
live = ["websockets>=12"]
# The Kalshi WebSocket source signs its connection (cryptography) and sends the
# signature as headers through websockets' asyncio client, which raises
# InvalidStatus for a refused key from websockets 14 on. The cryptography floor
# is the version in uv.lock.
kalshi = [
    "websockets>=14",
    "cryptography>=50.0.0",
]
# The ccxt and cryptofeed floors are the oldest versions CI tests (the ones in
# uv.lock). Older releases lack venues the sources use: ccxt 4.0 has no
# Coinbase in ccxt.pro, and cryptofeed 2.0 has no Independent Reserve.
ccxt = [
    "ccxt>=4.5.90",
]
cryptofeed = [
    "cryptofeed>=2.4.1",
]
# The floor is the version this adapter was written and tested against; the
# DBN record constructors the writer uses are newer than the reader's API.
databento = [
    "databento>=0.86",
]

[project.scripts]
ob-analytics = "ob_analytics.cli:main"

# Plug-ins in other packages advertise themselves under these entry-point
# groups, so they load without any edit to ob-analytics. One loader in
# ob_analytics._registry scans each group: at `import ob_analytics` for the
# first five, and at `import ob_analytics.visualization` for plot backends.
# In a plug-in package's own pyproject.toml, for example:
#   [project.entry-points."ob_analytics.sources"]
#   coinbase = "my_package.coinbase:CoinbaseSource"
# A source or writer entry names the class or factory to register under the
# entry-point name; a metric, bar rule or feature entry names a class that is
# constructed with no arguments and registered under its own `name`; a plot
# backend entry names the module that registers its renderers, imported on
# first use. The built-ins register on import and are not listed here.
[project.entry-points."ob_analytics.sources"]

[project.entry-points."ob_analytics.metrics"]

[project.entry-points."ob_analytics.bar_rules"]

[project.entry-points."ob_analytics.features"]

[project.entry-points."ob_analytics.writers"]

[project.entry-points."ob_analytics.plot_backends"]

[project.urls]
Homepage = "https://github.com/mczielinski/ob-analytics"
Documentation = "https://mczielinski.github.io/ob-analytics/"
Repository = "https://github.com/mczielinski/ob-analytics"
Changelog = "https://github.com/mczielinski/ob-analytics/blob/main/CHANGELOG.md"
Issues = "https://github.com/mczielinski/ob-analytics/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "coverage[toml]>=7.14.3,<8",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
    "ty>=0.0.55",
    "zensical>=0.0.46",
    "mkdocstrings[python]>=1.0.4",
    "pandas-stubs>=3.0.3.260530",
    "types-seaborn>=0.13.2.20260518",
    "plotly>=6.8.0",
    "bokeh>=3.1",
    "hypothesis>=6.155.7",
    # Dev-only, and deliberately not a runtime dependency or an extra: it is
    # here so the tests for PipelineResult.to_polars() can run. See
    # adr/0002-dataframe-library.md.
    "polars>=1.20",
    "nbmake>=1.5.1",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbconvert>=7.16",
    "pytest-xdist>=3.8,<4",
]

# The two backtesting engines, installed only to cross-check our reconstruction
# against theirs (issue #224).  Deliberately a group of its own rather than part
# of ``dev``: the writers in ob_analytics.interop need neither engine present,
# so only the parity tests pay for these, and CI can leave them out.
backtest-engines = [
    "hftbacktest>=2.4",
    # hftbacktest declares numba as an optional extra but imports it
    # unconditionally in its ``__init__``, so it has to be named here or
    # ``import hftbacktest`` fails.  Its own ``numpy`` extra caps numpy below
    # 2.3 and is therefore not usable here; numba 0.67 takes numpy 2.4.
    "numba>=0.67",
    # Nautilus publishes no build that takes both Python 3.11 and pandas 3, so
    # on 3.11 it is left out and the Nautilus half of the cross-check skips,
    # the same way the ccxt and cryptofeed tests skip without their extra.
    "nautilus-trader>=1.222; python_version >= '3.12'",
]

[tool.ruff.lint]
# BLE001, S110 and S102 make every `except Exception`, every `except: pass`
# and every `exec` carry a `noqa` comment that says why it is safe there.
extend-select = ["TID251", "BLE001", "S110", "S102"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# On Python 3.11 it drops a cancel that arrives with the result it awaits, and
# a live capture then cannot stop a segment (issue #296).
"asyncio.wait_for".msg = "Use `async with asyncio.timeout(...)`: on Python 3.11 wait_for can drop a cancel."

[tool.ruff.lint.isort]
# Keep aliased re-exports in a single grouped ``from x import (a as b, ...)``
# block rather than exploding each alias onto its own import statement.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# The tutorial sources are Jupytext notebooks: each one imports what it needs
# in the cell that introduces them (E402), and a bare expression on a cell's
# last line is the idiomatic way to render its value as the cell output, not
# dead code (B018) -- both by design.
"docs/tutorial/src/*.py" = ["E402", "B018"]

# The parity tests import hftbacktest and nautilus-trader, which live in the
# ``backtest-engines`` group rather than ``dev``, so the type check runs with
# neither installed.  Stated once here instead of on every import, because an
# inline suppression would itself become an unused-suppression error for a
# contributor who does install the group.
[[tool.ty.overrides]]
include = ["tests/test_backtest_parity.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.hatch.build.targets.sdist]
# A leading slash anchors each pattern at the project root. Without it,
# hatchling also matches an `ob_analytics` folder anywhere below the root, such
# as one in an agent worktree under `.claude/`. The excludes keep out hidden
# files and caches, such as `ob_analytics/.claude/` or `.ruff_cache/`, which
# hatchling packs from a git worktree even when git ignores them.
include = ["/ob_analytics", "/tests"]
exclude = [".*", "__pycache__/"]

[tool.hatch.build.targets.wheel]
include = ["/ob_analytics"]
exclude = [".*", "__pycache__/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is intentionally NOT in addopts: instrumenting the pipeline's hot
# Python loops slows local runs severely; CI passes --cov explicitly.

[tool.coverage.run]
source = ["ob_analytics"]
omit = ["tests/*"]
# The CLI tests run `python -m ob_analytics` in a subprocess. Measure those
# runs too, or cli.py shows as mostly untested.
patch = ["subprocess"]
