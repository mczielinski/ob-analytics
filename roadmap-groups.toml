# Which issues each roadmap diagram draws, and what to call them.
#
# Read by scripts/roadmap.py, which writes the generated blocks in epic #124
# and in each goal issue. See that file's docstring for how the whole
# thing works.
#
# Edges are NEVER listed here. A group is a set of nodes; the generator draws
# whatever blocked_by edges GitHub holds between them. GitHub's graph is the
# only store of the dependencies, and this file only says which nodes appear
# together and what to call them.
#
# An issue may appear in several groups. Issues in no group are still listed
# under "Ungrouped" in #124, and they still appear in the diagram of any goal
# that depends on them, so leaving one out is untidy rather than broken.
#
# Goals are not listed here at all. Each goal issue draws its own diagram from
# its own prerequisites.
#
# A caption says what a diagram is for. It never says where the work stands:
# what is done, what is next and what waits on what are all drawn in the
# diagram under it and recomputed on every run, and a caption that repeats them
# is wrong as soon as an issue closes. Every issue listed in a group is drawn,
# closed or not.

[[group]]
id = "foundation"
title = "Part 1 - the foundation"
prose = """
Everything the library does reads the same schema, so everything here waits on
it, directly or through a piece built on it. This diagram is the order that
dependency forces.
"""
issues = [112, 136, 137, 104, 113, 140, 216]

[[group]]
id = "data-model"
title = "Part 1b - the five data-model decisions"
prose = """
The schema left five choices open, and each would quietly corrupt the data if
it were wrong. They follow the Databento and Nautilus conventions, written in
Arrow and Parquet: timestamps as tz-aware UTC nanoseconds, exchange time and
receive time both; a nullable venue sequence plus a local counter, so that
messages sharing an instant still have an order and a dropped one is visible;
prices as integer ticks with a per-instrument tick size, matching the engine's
own binning; sizes as integer lots with a per-instrument lot size, for the same
reason, so that a price level empties to exactly zero instead of to float
residue; and readable symbol and venue columns rather than a numeric id and a
definitions join. All five stay drawn, closed or not, because together they are
the data model.
"""
issues = [112, 146, 429, 154, 155, 226]

[[group]]
id = "sources"
title = "Part 2 - data sources"
prose = """
Sources are plug-ins on one shape, so a new venue is a small piece of work.
Every source stays drawn once it is built, which makes this diagram the venue
list as well: purple is a source you can use today, green is one nobody has
written yet. A venue neither CCXT nor cryptofeed covers needs its own client.
"""
issues = [112, 137, 106, 134, 99, 100, 101, 102, 103, 98, 240]

[[group]]
id = "engine"
title = "Part 3 - a faster engine and a streaming core"
prose = """
Speed and size. The faster engine and the streaming core are built last, and the
work on data larger than memory sits here too. The diagram shows what each one
waits on.
"""
issues = [112, 136, 100, 114, 143, 144, 116, 138, 139, 206, 424]

[[group]]
id = "analytics"
title = "Part 4 - metrics, signals and model inputs"
prose = """
Measurements taken from a rebuilt book. They read the same input and are mostly
independent of each other, so any arrow drawn here is the exception rather than
an order to work in.
"""
issues = [104, 107, 109, 110, 111, 119, 147, 148, 149, 203]

[[group]]
id = "quality"
title = "Part 5 - data quality checks"
prose = """
Ways to find out whether loaded data is sound: data with known answers to check
against, a test that the engine gives the same numbers, a replay through someone
else's engine to see whether it agrees, gap detection from sequence numbers, a
command that reports what it finds, and a capture that does not drop data in the
first place. Each one stays drawn after it ships, because a check that exists is
still a way to check.

The golden files and the cross-check answer different questions. A golden file
catches a change, but it cannot catch a mistake that was there when the file was
recorded, because the baseline and the code agree by construction. Replaying the
same events through an engine written by someone else can: if the two books
disagree, one of them is wrong.
"""
issues = [108, 114, 143, 146, 150, 224, 262, 282, 283, 284, 296, 425]

[[group]]
id = "viz"
title = "Part 6 - plots and interactive views"
prose = """
The full plot catalogue, one theme across backends, and a second backend. The
live view (the first stage of the streaming core) and the replay scrubber show
a book as it changes.
"""
issues = [117, 118, 122, 123, 139, 140, 272, 302, 303]

[[group]]
id = "release"
title = "Part 7 - packaging, docs and release decisions"
prose = """
What a version other projects can depend on needs: the release decisions,
conda-forge distribution, API-key handling, and the documentation work.
"""
issues = [115, 120, 121, 141, 142, 145, 216, 239, 288]

[[group]]
id = "audit-a"
title = "Audit 1 - wrong answers, crashes and security"
prose = """
The 2026 audit (#339) found these by reading the whole package. They come first
because each one can give a user a wrong number, a crash, or a leak.
"""
issues = [397, 398, 399, 400, 314, 389, 391, 392]

[[group]]
id = "audit-b"
title = "Audit 2 - structure"
prose = """
One owner for each job: the capture folder format, the shared helpers, the
plug-in registries, the plot declarations. The renames wait for this, so names
are chosen once the shape has settled.
"""
issues = [401, 402, 403, 404, 405, 406, 407]

[[group]]
id = "audit-c"
title = "Audit 3 - symmetry and names"
prose = """
Things with the same job look the same: one error for one mistake, one shape
for every plot entry point, and one name for each thing. The three renames run
one after another, because each touches every area.
"""
issues = [408, 409, 410, 411, 412, 413, 414]

[[group]]
id = "audit-d"
title = "Audit 4 - dead code and dependencies"
prose = """
What nothing uses any more: dependencies, scripts and code paths.
"""
issues = [415]

[[group]]
id = "audit-e"
title = "Audit 5 - tests and CI"
prose = """
Checks that would catch these problems next time: required checks on main, a
core-only install, the dependency floors, Windows, invariants over every source,
and bad files.
"""
issues = [416, 417, 418, 419, 390]

[[group]]
id = "audit-f"
title = "Audit 6 - documentation and the 0.2.0 release"
prose = """
The docs are written once the names are fixed, and 0.2.0 waits for every audit
issue, so users learn the settled names once.
"""
issues = [420, 421, 422, 423, 426]

# Either/or prerequisites.
#
# GitHub's blocked_by has no OR, so both members are wired as hard blockers.
# Without these declarations the goal looks like it needs both, and its blocker
# count is one too high, which can show a goal as blocked when it is ready to
# check. The generator draws each group as one node and treats it as satisfied
# as soon as any member closes.

[[alternative]]
goal = 173
any_of = [134, 99]
label = "a live source"

[[alternative]]
goal = 179
any_of = [102, 103]
label = "a prediction market"

# Work that is ready, but should wait.
#
# The graph knows what blocks what; it cannot know that a piece of unblocked
# work is a bad idea today. That judgement used to sit in the epic as prose,
# where it outlived the issues it named. Here it is attached to the issues, so
# the generator prints it only while they are open and drops it when they close.
#
# A reason says why the work waits and what would end the wait. It names no
# issue numbers: the generator prints the numbers beside it.

[[hold]]
issues = [138, 203]
reason = """\
build these only when a measurement asks for them. The speed test put most of \
the run time in the depth metrics, which is an argument against porting the \
loaders\
"""

