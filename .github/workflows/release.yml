name: Release

# Publish to PyPI on a `v*` tag via trusted publishing (OIDC, no stored token).
# A manual `workflow_dispatch` run publishes to TestPyPI as a dry run.
#
# One-time setup (repo owner): register trusted publishers for project
# `ob-analytics` at https://pypi.org/manage/account/publishing/ and
# https://test.pypi.org/manage/account/publishing/ (workflow `release.yml`,
# environments `pypi` / `testpypi`). See CONTRIBUTING.md -> "Releasing".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      # Publish only a commit that passed CI. Wait while its CI run is still
      # going (a tag is often pushed right after the merge), then refuse any
      # result but success. A cancelled or failed run has to be re-run on
      # that commit before the release can go ahead.
      - name: Require green CI on this commit
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then
            echo "::error::no CI run found for $GITHUB_SHA; push it to main first"
            exit 1
          fi
          gh run watch "$id" --exit-status --interval 30
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv build
      # The same check as the `wheel` job in ci.yml, on the wheel this run
      # publishes.
      - uses: ./.github/actions/smoke-wheel
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject version $pkg"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    # Dry run: a manual dispatch publishes to TestPyPI.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    # Real release: a `v*` tag publishes to PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Attach a GitHub Release with the changelog section + the built artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract changelog notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}." > notes.md
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
