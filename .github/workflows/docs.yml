name: Docs

# Build the Zensical site and deploy it to GitHub Pages on every push to main.
# Pull requests build the site (to catch doc breakage) but do not deploy.
#
# One-time setup (repo admin): Settings -> Pages -> Source = "GitHub Actions".

# Only the inputs the site is actually built from. Everything else -- tests,
# the roadmap generator, the other workflows, the ADRs -- cannot change a
# rendered page, and the build costs 7-13 minutes. `workflow_dispatch` has no
# filter, so a deploy can always be forced by hand.
#
# Keep this list in step with what the build reads: docs/ and its tutorial
# sources, the package (mkdocstrings renders its docstrings and the tutorial
# chapters execute against it), the three build scripts, the site and
# dependency config, and the two root files that docs/ pulls in via snippets
# (docs/changelog.md includes CHANGELOG.md, docs/architecture.md includes
# ARCHITECTURE.md).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ob_analytics/**'
      - 'scripts/build_tutorial.py'
      - 'scripts/build_gallery.py'
      - 'scripts/check_links.py'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CHANGELOG.md'
      - 'ARCHITECTURE.md'
      - '.github/workflows/docs.yml'
  pull_request:
    # Repeated verbatim: the workflow parser does not support YAML anchors.
    paths:
      - 'docs/**'
      - 'ob_analytics/**'
      - 'scripts/build_tutorial.py'
      - 'scripts/build_gallery.py'
      - 'scripts/check_links.py'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CHANGELOG.md'
      - 'ARCHITECTURE.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # One build at a time per branch or pull request. The group is keyed by ref
    # so that builds on different refs never queue behind (or cancel) each
    # other -- a shared group made every PR opened in the same minute fight
    # over one slot, and the losers were cancelled with no jobs run.
    #
    # Within one pull request a new push supersedes the running build, so stale
    # builds stop instead of running out their 10 minutes. On main nothing is
    # cancelled: every merged commit builds and publishes in turn.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev --extra interactive
      # Execute the tutorial chapters (docs/tutorial/src/*.py) and render
      # them to markdown + PNGs. Any failing snippet fails the build — the
      # published tutorial can never drift from the API.
      - run: uv run --group dev --extra interactive python scripts/build_tutorial.py
      # Render the example gallery (figures + thumbnail page) too.
      - run: uv run --group dev --extra interactive python scripts/build_gallery.py
      # Pass --extra to `uv run` too so its implicit sync keeps plotly installed
      # (mkdocstrings imports ob_analytics.visualization to read its docstrings).
      - run: uv run --group dev --extra interactive zensical build
      # Fail the build on broken internal links or anchors in the rendered
      # site (relative cross-links and #fragments between pages). External
      # URLs are not fetched, so there is no network flakiness.
      - run: uv run python scripts/check_links.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Deploy only from main; PRs stop after the build job above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time; never cancel an in-progress publish. This is
    # the only job that touches Pages, so it keeps the shared `pages` group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # The Pages backend intermittently rejects fresh deployments with
      # "Deployment failed, try again later" (seen twice on 2026-07-03).
      # Wait out the transient and deploy once more before giving up.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
